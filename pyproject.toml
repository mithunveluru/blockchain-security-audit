[tool.ruff]
line-length = 140
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E9", "F", "B", "S"]
ignore = ["B904", "B905", "S101", "S311", "S603", "S607", "S104", "B008", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"threat_demo.sh" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
